
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>発注計算</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  background: #f3f4f6;
  color: #222;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #222;
  color: white;
  padding: 14px;
  text-align: center;
}

header h1 {
  font-size: 20px;
  margin: 0;
}

main {
  padding: 12px;
  max-width: 720px;
  margin: auto;
  padding-bottom: 95px;
}

.box {
  background: white;
  padding: 14px;
  margin-bottom: 14px;
  border-radius: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.title {
  font-size: 18px;
  font-weight: bold;
  border-left: 6px solid #222;
  padding-left: 10px;
  margin-bottom: 12px;
}

.group {
  font-weight: bold;
  background: #eee;
  padding: 8px 10px;
  border-radius: 10px;
  margin: 16px 0 6px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 130px;
  gap: 10px;
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid #eee;
}

.name {
  font-size: 15px;
  line-height: 1.4;
}

.counter {
  display: grid;
  grid-template-columns: 34px 58px 34px;
  gap: 4px;
}

.counter button {
  height: 40px;
  border: none;
  border-radius: 10px;
  background: #e5e7eb;
  font-size: 22px;
}

input {
  width: 58px;
  height: 40px;
  font-size: 20px;
  text-align: center;
  border: 1px solid #ccc;
  border-radius: 10px;
}

.actions {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  background: rgba(243,244,246,.96);
  padding: 10px;
  border-top: 1px solid #ddd;
}

.actions button {
  padding: 15px;
  font-size: 18px;
  font-weight: bold;
  border: none;
  border-radius: 14px;
  color: white;
}

.calcBtn { background: #222; }
.resetBtn { background: #999; }

.supplier {
  background: #222;
  color: white;
  padding: 10px;
  border-radius: 12px;
  font-weight: bold;
  margin: 16px 0 10px;
}

.card {
  background: #fafafa;
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 10px;
}

.order {
  font-size: 21px;
  font-weight: bold;
}

.amount {
  color: #555;
  margin-top: 5px;
}

summary {
  margin-top: 8px;
  padding: 8px;
  background: #eee;
  border-radius: 8px;
  font-size: 14px;
}

.detail {
  font-size: 14px;
  color: #555;
  line-height: 1.7;
  padding-top: 8px;
}

.note, .empty {
  color: #666;
  font-size: 14px;
  line-height: 1.7;
}
</style>
</head>

<body>

<header>
  <h1>発注計算</h1>
</header>

<main>

<div class="box">
  <div class="title">予約人数入力</div>

  <div id="inputs"></div>

  <div class="note">
    ※雅・九十九・牡丹はメイン別入力<br>
    ※うどん・ほうとうは4人前で1玉<br>
    ※発注数は端数切り上げ
  </div>
</div>

<div class="box">
  <div class="title">発注結果</div>
  <div id="result" class="empty">人数を入力して「計算する」を押してください。</div>
</div>

</main>

<div class="actions">
  <button class="calcBtn" onclick="calc()">計算する</button>
  <button class="resetBtn" onclick="resetForm()">リセット</button>
</div>

<script>
const inputList = [
  ["席のみ", "seat"],
  ["堪能コース", "tanno"],
  ["極みコース", "kiwami"],
  ["甲斐の国コース", "kai"],
  ["雅：ちゃんこ鍋", "miyabiNabe", "雅コース"],
  ["雅：ガーリックロースステーキ", "miyabiSteak"],
  ["九十九：旨辛豚バラ鉄板焼き", "tukumoBara", "九十九コース"],
  ["九十九：2種肉ステーキ盛り", "tukumoSteak"],
  ["牡丹：3種肉ステーキ盛り", "botanSteak", "牡丹コース"],
  ["牡丹：豚とホルモンのスタミナ焼き", "botanKoma"]

];

const inputBox = document.getElementById("inputs");

inputList.forEach(([label, id, group]) => {
  if (group) inputBox.innerHTML += `<div class="group">${group}</div>`;
  inputBox.innerHTML += `
    <div class="row">
      <div class="name">${label}</div>
      <div class="counter">
        <button onclick="minus('${id}')">−</button>
        <input id="${id}" type="number" inputmode="numeric" min="0" value="0">
        <button onclick="plus('${id}')">＋</button>
      </div>
    </div>
  `;
});

function n(id) {
  return Number(document.getElementById(id).value) || 0;
}

function up(num) {
  return Math.ceil(num);
}

function plus(id) {
  document.getElementById(id).value = n(id) + 1;
}

function minus(id) {
  document.getElementById(id).value = Math.max(0, n(id) - 1);
}

function card(name, pc, amount, detail) {
  if (pc <= 0 || !isFinite(pc)) return "";
  return `
    <div class="card">
      <div class="order">${name}：${pc} pc</div>
      <div class="amount">${amount}</div>
      <details>
        <summary>計算内容を見る</summary>
        <div class="detail">${detail}</div>
      </details>
    </div>
  `;
}

function calc() {
  const seat = n("seat");
  const tanno = n("tanno");
  const miyabiNabe = n("miyabiNabe");
  const miyabiSteak = n("miyabiSteak");
  const miyabi = miyabiNabe + miyabiSteak;
  const tukumoBara = n("tukumoBara");
  const tukumoSteak = n("tukumoSteak");
  const tukumo = tukumoBara + tukumoSteak;
  const botanSteak = n("botanSteak");
  const botanKoma = n("botanKoma");
  const botan = botanSteak + botanKoma;
  const kiwami = n("kiwami");
  const kai = n("kai");

  const total = seat + tanno + miyabi + tukumo + botan + kiwami + kai;

  if (total === 0) {
    result.innerHTML = "人数を入力してください。";
    return;
  }

  let html = `<div class="amount">入力合計：${total}名</div>`;
  html += `<div class="supplier">高瀬物産</div>`;

  let potatoPeople = seat + miyabi + tukumo + botan + kiwami + kai;
  let potatoGram = potatoPeople * 40;
  html += card("ポテトサラダ", up(potatoGram / 1000), `必要量：${potatoGram}g`,
    `${potatoPeople}名 × 40g = ${potatoGram}g<br>1pc=1000g<br>${potatoGram}÷1000=${(potatoGram/1000).toFixed(2)}pc`);

  let asariPeople = miyabi + botan;
  let asariGram = asariPeople * 50;
  html += card("あさり", up(asariGram / 500), `必要量：${asariGram}g`,
    `${asariPeople}名 × 50g = ${asariGram}g<br>1pc=500g<br>${asariGram}÷500=${(asariGram/500).toFixed(2)}pc`);

  let tamagoPeople = tanno + tukumo + botan + kiwami;
  html += card("厚焼き玉子", up(tamagoPeople / 16), `必要数：${tamagoPeople}人前`,
    `${tamagoPeople}人前 ÷ 16 = ${(tamagoPeople/16).toFixed(2)}pc`);

  let dessertPeople = miyabi + tukumo + botan + kiwami + kai;
  html += card("デザート", up(dessertPeople / 30), `必要数：${dessertPeople}人前`,
    `${dessertPeople}人前 ÷ 30 = ${(dessertPeople/30).toFixed(2)}pc`);

  let kamoPeople = tanno + kiwami + kai;
  html += card("かも", up(kamoPeople / 100), `必要数：${kamoPeople}人前`,
    `${kamoPeople}人前 ÷ 100 = ${(kamoPeople/100).toFixed(2)}pc`);

  let edamameGram = kiwami * 37.5;
  html += card("枝豆", up(edamameGram / 1000), `必要量：${edamameGram}g`,
    `${kiwami}名 × 37.5g = ${edamameGram}g<br>${edamameGram}÷1000=${(edamameGram/1000).toFixed(2)}pc`);

  let udonPeople = miyabi + tukumo + kiwami;
  let udonTama = udonPeople / 4;
  html += card("うどん", up(udonTama / 5), `必要数：${udonTama.toFixed(2)}玉`,
    `${udonPeople}名 ÷ 4 = ${udonTama.toFixed(2)}玉<br>${udonTama.toFixed(2)}÷5=${(udonTama/5).toFixed(2)}pc`);

  let houtouTama = kai / 4;
  html += card("ほうとう", up(houtouTama / 5), `必要数：${houtouTama.toFixed(2)}玉`,
    `${kai}名 ÷ 4 = ${houtouTama.toFixed(2)}玉<br>${houtouTama.toFixed(2)}÷5=${(houtouTama/5).toFixed(2)}pc`);

  html += card("魚（たら）", up(kiwami / 5), `必要数：${kiwami}切れ`,
    `${kiwami}切れ ÷ 5 = ${(kiwami/5).toFixed(2)}pc`);

  html += `<div class="supplier">わたなべ（肉屋）</div>`;

  let chickenGram = (tanno*50) + (miyabiNabe*50) + (tukumoSteak*50) + (botanSteak*50);
  html += card("鶏もも", up(chickenGram / 2000), `必要量：${chickenGram}g`,
    `${chickenGram}g ÷ 2000 = ${(chickenGram/2000).toFixed(2)}pc`);

  let porkLoinGram = (miyabiSteak*50) + (tukumoSteak*50) + (botanSteak*50);
  html += card("豚ロース", up(porkLoinGram / 1000), `必要量：${porkLoinGram}g`,
    `${porkLoinGram}g ÷ 1000 = ${(porkLoinGram/1000).toFixed(2)}pc`);

  let shabuGram = kai * 50;
  html += card("豚ロース（しゃぶしゃぶ用）", up(shabuGram / 1000), `必要量：${shabuGram}g`,
    `${kai}名 × 50g = ${shabuGram}g<br>${shabuGram}÷1000=${(shabuGram/1000).toFixed(2)}pc`);

  let porkBaraGram = tukumoBara * 60;
  html += card("豚バラ", up(porkBaraGram / 1000), `必要量：${porkBaraGram}g`,
    `${tukumoBara}名 × 60g = ${porkBaraGram}g<br>${porkBaraGram}÷1000=${(porkBaraGram/1000).toFixed(2)}pc`);

  let haramiSteakGram = botanSteak * 20;
  html += card("ハラミ（ステーキ用）", up(haramiSteakGram / 700), `必要量：${haramiSteakGram}g`,
    `${haramiSteakGram}g ÷ 700g = ${(haramiSteakGram/700).toFixed(2)}pc<br>1pc=1kg 処理後約700g`);

  let haramiYukkeGram = botan * 20;
  html += card("ハラミ（ユッケ用）", up(haramiYukkeGram / 700), `必要量：${haramiYukkeGram}g`,
    `${haramiYukkeGram}g ÷ 700g = ${(haramiYukkeGram/700).toFixed(2)}pc<br>1pc=1kg 処理後約700g`);

  let porkKomaGram = botanKoma * 60;
  html += card("豚こま", up(porkKomaGram / 1000), `必要量：${porkKomaGram}g`,
    `${porkKomaGram}g ÷ 1000 = ${(porkKomaGram/1000).toFixed(2)}pc`);

  let beefGram = kiwami * 100;
  html += card("牛バラ", up(beefGram / 1000), `必要量：${beefGram}g`,
    `${kiwami}名 × 100g = ${beefGram}g<br>${beefGram}÷1000=${(beefGram/1000).toFixed(2)}pc`);

  result.innerHTML = html;
}

function resetForm() {
  inputList.forEach(([_, id]) => {
    document.getElementById(id).value = 0;
  });
  result.innerHTML = "人数を入力して「計算する」を押してください。";
}
</script>

</body>
</html>
